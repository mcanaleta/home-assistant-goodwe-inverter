[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ASYNC", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "ASYNC240"]

[tool.coverage.run]
branch = true
source = ["custom_components.goodwe"]

[tool.coverage.report]
show_missing = true
